<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Naivolabs">
  <title>Naivolabs</title>
  <!-- Lime tile, ink glyph. A single flat accent rather than a gradient:
       gradients disappear at 16px and turn to mud in a browser tab. -->
  <rect width="512" height="512" rx="96" fill="#f3ffc9"/>
  <!-- The N: two stems and a diagonal, drawn heavy enough to survive 16px. -->
  <g fill="#0e100f">
    <rect x="132" y="128" width="56" height="256" rx="10"/>
    <rect x="324" y="128" width="56" height="256" rx="10"/>
    <path d="M132 128h60l188 256h-60z"/>
  </g>
</svg>
