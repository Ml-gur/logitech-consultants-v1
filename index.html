<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon set, generated by scripts/generate-brand-assets.mjs.
         favicon.svg is the primary (crisp at every size); the PNGs cover
         browsers without SVG support, iOS home-screen installs and Android. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preload the critical display + body fonts: the hero h1 (Inter 500) is
         the LCP element; fetching fonts during HTML parse removes them from the
         text-paint critical path. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/5A3Ce6C9YYmCjpQx9M4inSaKU.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/5vvr9Vy74if2I6bQbJvbw7SY1pQ.woff2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e0e" />
    <meta name="color-scheme" content="dark" />

    <!-- SEO baseline. index.html is served for every route before JS runs, so
         this is the fallback metadata; per-route title/description/canonical/
         OG are applied at runtime by src/lib/Seo.tsx and Googlebot reads the
         rendered DOM. Keep the two in sync, both source identity from
         src/lib/brand.ts. -->
    <title>Naivolabs: Applied AI Systems for Organizations</title>
    <meta
      name="description"
      content="Naivolabs is an applied AI systems company. We design, build and deploy governed intelligent systems that work inside real organizational environments."
    />
    <link rel="canonical" href="https://naivolabs.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Naivolabs: Applied AI Systems for Organizations" />
    <meta
      property="og:description"
      content="Put intelligence to work. Governed AI systems that communicate, understand, act and orchestrate, inside real organizations, with the results measured."
    />
    <meta property="og:url" content="https://naivolabs.com/" />
    <meta property="og:image" content="https://naivolabs.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Naivolabs. Put intelligence to work." />
    <meta property="og:site_name" content="Naivolabs" />
    <meta property="og:locale" content="en_KE" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Naivolabs: Applied AI Systems for Organizations" />
    <meta
      name="twitter:description"
      content="Put intelligence to work. Governed AI systems that communicate, understand, act and orchestrate, inside real organizations, with the results measured."
    />
    <meta name="twitter:image" content="https://naivolabs.com/og-image.png" />

    <!-- Organization structured data (sitewide baseline; route-specific
         JSON-LD is injected at runtime by Seo.tsx). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Naivolabs",
        "legalName": "Naivolabs",
        "url": "https://naivolabs.com/",
        "logo": "https://naivolabs.com/favicon-512.png",
        "image": "https://naivolabs.com/og-image.png",
        "slogan": "Intelligence at work.",
        "email": "hello@naivolabs.com",
        "telephone": "+254112292847",
        "description": "Naivolabs is an applied AI systems company. We design, build and deploy governed intelligent systems that work inside real organizational environments.",
        "foundingDate": "2026",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "51 Lenana Road",
          "addressLocality": "Nairobi",
          "addressCountry": "KE",
          "postalCode": "00100"
        },
        "areaServed": [
          { "@type": "City", "name": "Nairobi" },
          { "@type": "Country", "name": "Kenya" },
          { "@type": "Place", "name": "Worldwide" }
        ],
        "knowsAbout": [
          "Applied AI systems",
          "Voice agents",
          "Conversational AI",
          "Knowledge retrieval systems",
          "Workflow automation",
          "AI governance and evaluation"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
