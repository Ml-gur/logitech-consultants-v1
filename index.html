<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon set, generated by scripts/generate-brand-assets.mjs — run it
         after changing the palette. favicon.svg is the primary (crisp at every
         size); the PNGs cover browsers without SVG support, iOS home-screen
         installs and Android. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Both families are self-hosted (see src/index.css); there is no font
         CDN. Preload the two faces on the first-paint path — Inter 400 for body
         copy and Inter 500 for the labels and emphasis above the fold — so they
         are fetched during HTML parse rather than after CSS resolves. JetBrains
         Mono is not preloaded: it only appears in small numeric labels further
         down the page. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-500.woff2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e100f" />
    <meta name="color-scheme" content="light dark" />

    <!-- Theme resolution, before first paint.
         The site is dark-first; light is chosen by the visitor (persisted) or
         taken from the operating system when it explicitly asks for light.
         Running it here rather than in the bundle is what stops a light-mode
         visitor seeing a dark flash on every navigation. The key and the
         resolution order are mirrored in src/lib/theme.ts — change both
         together. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('naivolabs.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          if (theme === 'dark') document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>

    <!-- SEO baseline. index.html is served for every route before JS runs, so
         this is the fallback metadata; per-route title/description/canonical/
         OG are applied at runtime by src/lib/Seo.tsx and Googlebot reads the
         rendered DOM. Keep the two in sync, both source identity from
         src/lib/brand.ts. -->
    <title>Naivolabs — Applied AI systems for organizations</title>
    <meta
      name="description"
      content="Naivolabs is an applied AI systems company. We design, build and deploy governed AI systems that complete real work inside real organizations."
    />
    <link rel="canonical" href="https://naivolabs.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Naivolabs — Applied AI systems for organizations" />
    <meta
      property="og:description"
      content="Governed AI systems that finish the work: voice, knowledge and workflow systems deployed inside real organizations, measured against targets agreed before launch."
    />
    <meta property="og:url" content="https://naivolabs.com/" />
    <meta property="og:image" content="https://naivolabs.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Naivolabs. Intelligence at work." />
    <meta property="og:site_name" content="Naivolabs" />
    <meta property="og:locale" content="en_KE" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Naivolabs — Applied AI systems for organizations" />
    <meta
      name="twitter:description"
      content="Governed AI systems that finish the work: voice, knowledge and workflow systems deployed inside real organizations, measured against targets agreed before launch."
    />
    <meta name="twitter:image" content="https://naivolabs.com/og-image.png" />

    <!-- Organization structured data (sitewide baseline; route-specific
         JSON-LD is injected at runtime by Seo.tsx). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Naivolabs",
        "legalName": "Naivolabs",
        "url": "https://naivolabs.com/",
        "logo": "https://naivolabs.com/favicon-512.png",
        "image": "https://naivolabs.com/og-image.png",
        "slogan": "Intelligence at work.",
        "email": "hello@naivolabs.com",
        "telephone": "+254112292847",
        "description": "Naivolabs is an applied AI systems company. We design, build and deploy governed AI systems that complete real work inside real organizations.",
        "foundingDate": "2026",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "51 Lenana Road",
          "addressLocality": "Nairobi",
          "addressCountry": "KE",
          "postalCode": "00100"
        },
        "areaServed": [
          { "@type": "City", "name": "Nairobi" },
          { "@type": "Country", "name": "Kenya" },
          { "@type": "Place", "name": "Worldwide" }
        ],
        "knowsAbout": [
          "Applied AI systems",
          "Voice agents",
          "Conversational AI",
          "Knowledge retrieval systems",
          "Workflow automation",
          "AI governance and evaluation"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
