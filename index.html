<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Logo-derived favicons (abstract mark; 2026-08-05, operator logo).
         favicon.svg is the pre-rebrand icon and is no longer referenced. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/favicon-64.png" />
    <!-- Preload the critical display + body fonts: the hero h1 (Inter 500) is
         the LCP element; fetching fonts during HTML parse removes them from the
         text-paint critical path (measured 2026-08-05, performance pass). -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/5A3Ce6C9YYmCjpQx9M4inSaKU.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/5vvr9Vy74if2I6bQbJvbw7SY1pQ.woff2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e0e" />
    <!-- SEO baseline (index.html is served for every route before JS runs;
         per-route title/description/canonical/OG are applied at runtime by
         src/lib/Seo.tsx, and Googlebot reads the rendered DOM). -->
    <title>Logitech Consultants – AI Automation Agency</title>
    <meta name="description" content="AI automation agency: we find where AI creates real value, build the automations and agents to capture it, and make sure they keep working long after the engagement ends." />
    <link rel="canonical" href="https://logitechconsultants.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Logitech Consultants – AI Automation Agency" />
    <meta property="og:description" content="AI automation agency: we find where AI creates real value, build the automations and agents to capture it, and make sure they keep working long after the engagement ends." />
    <meta property="og:url" content="https://logitechconsultants.com/" />
    <meta property="og:image" content="https://logitechconsultants.com/og-image.png" />
    <meta property="og:site_name" content="Logitech Consultants" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Logitech Consultants – AI Automation Agency" />
    <meta name="twitter:description" content="AI automation agency: we find where AI creates real value, build the automations and agents to capture it, and make sure they keep working long after the engagement ends." />
    <meta name="twitter:image" content="https://logitechconsultants.com/og-image.png" />
    <!-- ProfessionalService structured data (sitewide baseline; route-specific
         JSON-LD is injected at runtime by Seo.tsx). Local-business entity with
         Nairobi geo + hours anchors regional relevance for local & AI search. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Logitech Consultants",
        "url": "https://logitechconsultants.com/",
        "logo": "https://logitechconsultants.com/favicon-64.png",
        "email": "hello@logitechconsultants.com",
        "telephone": "+254112292847",
        "description": "AI automation agency: we find where AI creates real value, build the automations and agents to capture it, and make sure they keep working long after the engagement ends.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "51 Lenana Road",
          "addressLocality": "Nairobi",
          "addressCountry": "KE",
          "postalCode": "00100"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -1.2864,
          "longitude": 36.7812
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "09:00",
          "closes": "17:00"
        },
        "areaServed": [
          { "@type": "City", "name": "Nairobi" },
          { "@type": "Country", "name": "Kenya" }
        ],
        "priceRange": "$$"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Dograh Widget -->
    <script>
      (function(d, s, id) {
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s); js.id = id;
        js.src = 'http://localhost:3010/embed/dograh-widget.js?token=emb_UTMv5826kG3NSPO5PSD_bPzb6N2J2_ZgWLUp7ql6NNc&environment=local&apiEndpoint=http://localhost:8000';
        // Details about this visitor, available in your prompts as
        // {{initial_context.page_url}}. Edit these or add your own.
        js.setAttribute('data-dograh-context', JSON.stringify({
          page_url: window.location.href,
          today: new Date().toISOString().slice(0, 10)
        }));
        js.async = true;
        fjs.parentNode.insertBefore(js, fjs);
      }(document, 'script', 'dograh-widget'));
    </script>
  </body>
</html>
