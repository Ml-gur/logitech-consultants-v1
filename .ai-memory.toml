# ai-memory — project scope
#
# Declares the workspace/project pair that project-scoped memory calls must use
# for this repository. Read by the ai-memory Agent Skills in .agents/skills/
# (ai-memory-retrieval, ai-memory-durable-pages, ai-memory-handoff, ...).
#
# Keep these names stable: changing them orphans every page already written
# under the old project name.

workspace = "default"
project = "naivolabs-website"

[memory]
# This repo's durable knowledge lives in the markdown wiki the ai-memory server
# owns. The in-repo summary of decisions is docs/decisions/ (ADRs) — those are
# reviewed by humans and committed; ai-memory pages are the agent-facing layer.
agent_instructions = "AGENTS.md"
