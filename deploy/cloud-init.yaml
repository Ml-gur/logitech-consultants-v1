#cloud-config
# Naivolabs — first-boot hardening for a fresh Hetzner Cloud server.
#
# Paste this into the "Cloud config" box when creating the server in the Hetzner
# console (or pass with `hcloud server create --user-data-from-file`).
#
# It does four things: creates a non-root sudo user, disables password and
# root SSH, installs Docker from the official repo, and turns on automatic
# security updates. Everything after this is `docker compose`.

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    # Replace with your own public key before creating the server.
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...REPLACE_WITH_YOUR_PUBLIC_KEY operator@naivolabs

ssh_pwauth: false
disable_root: true

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - ufw
  - unattended-upgrades
  - fail2ban
  - htop
  - jq

write_files:
  # ---- SSH hardening -------------------------------------------------------
  - path: /etc/ssh/sshd_config.d/99-naivolabs.conf
    permissions: '0644'
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      AllowAgentForwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2

  # ---- Host firewall -------------------------------------------------------
  # Hetzner's cloud firewall is the first line; ufw is the second, so a
  # mis-click in the console cannot expose the database.
  - path: /etc/ufw/applications.d/naivolabs
    content: |
      [Naivolabs]
      title=Naivolabs web stack
      description=HTTP, HTTPS and SSH only
      ports=22,80,443/tcp

  # ---- Docker log rotation -------------------------------------------------
  # An unbounded json-file log will eventually fill the disk and take the whole
  # stack down. Cap it at the daemon level.
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "20m", "max-file": "5" },
        "live-restore": true
      }

runcmd:
  # SSH + firewall
  - systemctl restart ssh
  - ufw --force reset
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable

  # Docker (official repo, so we get current releases and security patches)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker deploy

  # Automatic security updates
  - |
    cat > /etc/apt/apt.conf.d/20auto-upgrades <<'EOF'
    APT::Periodic::Update-Package-Lists "1";
    APT::Periodic::Unattended-Upgrade "1";
    EOF
  - systemctl enable --now unattended-upgrades

  # fail2ban with the SSH jail
  - systemctl enable --now fail2ban

  # Application directory owned by the deploy user
  - install -d -o deploy -g deploy -m 0755 /srv/naivolabs
  - |
    cat > /srv/naivolabs/README.txt <<'EOF'
    Naivolabs production host.

    Deploy from your machine:
      rsync -avz --exclude node_modules --exclude .git ./ deploy@<host>:/srv/naivolabs/

    Then on the server:
      cd /srv/naivolabs/deploy
      cp .env.production.example .env && chmod 600 .env && $EDITOR .env
      ./deploy.sh
    EOF
  - chown deploy:deploy /srv/naivolabs/README.txt

final_message: "Naivolabs host ready after $UPTIME seconds. Deploy to /srv/naivolabs."
