# Naivolabs — security headers.
#
# Included by nginx.conf at the server level AND inside every location that sets
# a header of its own.
#
# Why the repetition: nginx inherits `add_header` from the enclosing block only
# when the inner block defines none of its own. Every caching location below
# adds a Cache-Control header, so without re-including this file the HTML
# document would be served with NO CSP and no nosniff/frame/referrer headers —
# the policy would only ever apply to assets.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content Security Policy.
# - 'unsafe-inline' for style is required by the inline critical CSS and by
#   Tailwind's runtime style attributes.
# - 'unsafe-inline' for script is required by index.html's inline voice-widget
#   bootstrap. Removing it is a follow-up (hash the inline script).
# - connect-src includes the CMS API origin (blog posts, FAQs, the contact form)
#   and the voice-widget API. If CMS_DOMAIN in deploy/.env is changed from the
#   default, the CMS host below must be changed to match, or the site falls back
#   to its bundled static content and the contact form stops posting.
# - img-src allows https: because CMS media is served from the CMS origin.
# - media-src names the one host the home hero's looping plate is served from.
#   Without it `default-src 'self'` is the fallback for media, so the <video>
#   was blocked and the first screen rendered empty on every visit.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.dograh.com https://api.dograh.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; font-src 'self' data:; connect-src 'self' https://api.dograh.com cms.naivolabs.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
