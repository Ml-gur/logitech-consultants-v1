# Naivolabs — security headers.
#
# Included by nginx.conf at the server level AND inside every location that sets
# a header of its own.
#
# Why the repetition: nginx inherits `add_header` from the enclosing block only
# when the inner block defines none of its own. Every caching location below
# adds a Cache-Control header, so without re-including this file the HTML
# document would be served with NO CSP and no nosniff/frame/referrer headers —
# the policy would only ever apply to assets.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content Security Policy.
# - style-src needs 'unsafe-inline' for Tailwind's runtime style attributes and
#   for the inline `style` props the scroll-driven components set.
# - script-src needs 'unsafe-inline' for the JSON-LD block in index.html. To
#   tighten it further, hash that block and drop 'unsafe-inline' — but note
#   'strict-dynamic' would then require every chunk to be hashed too.
# - connect-src lists the CMS origin: blog posts, deployment patterns, FAQs and
#   the contact form are fetched from it. If CMS_DOMAIN in deploy/.env changes,
#   change the host below to match, or the site silently falls back to bundled
#   content and the contact form stops posting.
# - All fonts are self-hosted, so font-src does not need a font CDN.
# - img-src allows https: because CMS media is served from the CMS origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' cms.naivolabs.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
