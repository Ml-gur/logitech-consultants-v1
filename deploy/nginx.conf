# Naivolabs — static site container (nginx)
#
# Serves the Vite production build from /usr/share/nginx/html.
#
# Design notes
# ------------
# * The app is a client-rendered SPA with real URL routes, so unmatched paths
#   must return index.html with a 200 (not nginx's default 404). But an unknown
#   path should still be a *soft* 404 for crawlers, which the app handles by
#   rendering the 404 page with `noindex, follow` (src/pages/NotFoundPage.tsx).
# * Static assets are content-hashed by Vite, so they are immutable. index.html
#   is never cached — a stale shell would pin an old asset graph.
# * Security headers live in nginx-security-headers.conf rather than in the app
#   so they apply to every response, including the ones nginx answers itself.
#   `add_header` is not inherited by a block that defines its own, so the
#   snippet is re-included wherever a location sets a Cache-Control header.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression -----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ---- Security headers -------------------------------------------------
    include /etc/nginx/snippets/naivolabs-security-headers.conf;

    # ---- Caching ---------------------------------------------------------
    # Hashed build assets and fonts: immutable for a year.
    location /assets/ {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /fonts/ {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Images change rarely and are not hashed — revalidate weekly.
    location /images/ {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/(favicon(-\d+)?\.(png|svg)|og-image\.png|site\.webmanifest)$ {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Crawler files must never be rewritten to the SPA shell, and must keep their
    # real content types: a sitemap served as application/octet-stream is not
    # reliably read by crawlers.
    location = /robots.txt {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- Health check (used by the compose healthcheck + Caddy) -----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- SPA fallback ----------------------------------------------------
    location / {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
