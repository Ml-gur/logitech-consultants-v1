# Naivolabs — proposed vhost for the shared host (77.42.30.150).
#
# THIS FILE IS A PROPOSAL. The deploy account has no sudo, so it is handed over
# rather than applied. Changes, all inside this one file:
#
#   1. REQUIRED — SPA fallback. Without it every deep link (/about,
#      /capabilities, /deployment-patterns, ...) 404s on a direct request or a
#      refresh, including every URL in sitemap.xml. The site has real URLs.
#   2. www → apex 301, so the site is not served on two hostnames.
#   3. gzip, long-lived caching for the content-hashed assets, the correct
#      application/manifest+json type for site.webmanifest (currently
#      application/octet-stream), and nosniff/frame/referrer headers.
#
# Deliberately UNCHANGED: the two Certbot-managed blocks are copied verbatim, so
# certificate renewal keeps working.
#
# TWO FILES. The security headers live in a snippet, because nginx does not
# inherit `add_header` into a location that defines its own, and every caching
# location below defines a Cache-Control. Without re-including the snippet the
# HTML document would be served with no nosniff/frame/referrer headers at all —
# which is what a naive version of this file did, caught by testing it.
#
# Install as root:
#
#   mkdir -p /etc/nginx/snippets
#   cp naivolabs-security-headers.conf /etc/nginx/snippets/naivolabs-security-headers.conf
#   cp /etc/nginx/sites-available/naivolabs /etc/nginx/sites-available/naivolabs.bak-$(date +%F)
#   cp naivolabs.com.conf /etc/nginx/sites-available/naivolabs
#   nginx -t && systemctl reload nginx

# ---- Apex: the site itself ------------------------------------------------
server {
    server_name naivolabs.com;

    root /var/www/naivolabs;
    index index.html;

    # ---- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml font/woff2;

    # ---- Security headers --------------------------------------------------
    include /etc/nginx/snippets/naivolabs-security-headers.conf;
    #
    # Content-Security-Policy is deliberately NOT enabled. The site loads a
    # third-party voice widget (app.dograh.com) that injects inline styles and
    # calls api.dograh.com. A CSP is written but has not been verified against
    # that widget in a real browser, and an unverified CSP silently breaks it.
    # Enable only after testing the widget with it on:
    #
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.dograh.com https://api.dograh.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; font-src 'self' data:; connect-src 'self' https://api.dograh.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---- Caching -----------------------------------------------------------
    # Vite content-hashes these filenames, so they are immutable. `expires` is
    # deliberately NOT used alongside these: it emits its own Cache-Control, and
    # the response would carry two conflicting ones (verified — the duplicate
    # headers showed up when this file was tested).
    location /assets/ {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /fonts/ {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /images/ {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
        try_files $uri =404;
    }

    # This nginx serves .webmanifest as application/octet-stream: its mime map
    # has no entry for the extension. The types block replaces the map inside
    # this exact-match location only, so nothing else is affected.
    location = /site.webmanifest {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # The app shell must never be cached, or a stale shell pins an old asset graph.
    location = /index.html {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- SPA fallback (the change that is actually required) ---------------
    # Unmatched paths return index.html with a 200 so the router renders the
    # right page. A path that matches no route renders the app's own 404 page,
    # which is noindex,follow — a soft 404, which is correct for crawlers.
    location / {
        include /etc/nginx/snippets/naivolabs-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/naivolabs.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/naivolabs.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ---- www: canonical redirect to the apex ----------------------------------
# Standard practice: one canonical hostname, so the two hostnames cannot be
# indexed as duplicates. The certificate already covers www, so no new
# certificate is needed. `ipv6only=on` is set once per address:port, on the
# apex block above, so it is not repeated here.
server {
    server_name www.naivolabs.com;

    return 301 https://naivolabs.com$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/naivolabs.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/naivolabs.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ===========================================================================
# Everything below is copied verbatim from the current vhost (Certbot-managed).
# The intermediate hop on http://www is intentional: renewal behaviour is left
# exactly as it is rather than reasoned about.
# ===========================================================================
server {
    if ($host = www.naivolabs.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = naivolabs.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name naivolabs.com www.naivolabs.com;
    return 404; # managed by Certbot
}
