# Naivolabs — security headers (shared host).
#
# Install to /etc/nginx/snippets/naivolabs-security-headers.conf and include it
# from the vhost at the server level AND inside every location that sets a
# header of its own.
#
# Why the repetition: nginx inherits `add_header` from the enclosing block only
# when the inner block defines none of its own. Each caching location adds a
# Cache-Control header, so without re-including this file those responses — the
# HTML document included — would carry no nosniff/frame/referrer headers at all.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
